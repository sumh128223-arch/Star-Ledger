<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认导入 - {{ filename }}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="theme-color" content="#4a5aa8">
  <link rel="icon" href="{{ url_for('static', filename='images/app-icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/app-icon-180.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="繁星记账本">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fx-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <style>
    /* ============================================================
       背景图片设置区（改这里就行）
       1. bg-image 是电脑横屏背景；bg-image-mobile 是手机竖屏背景（屏幕 ≤640px 自动切换）
          路径填你的图片名字，图片要放进 static/images/ 文件夹
       2. bg-size 控制图片怎么填满卡片，可选：
          - cover   图片铺满卡片，边缘可能被裁掉（默认，推荐）
          - contain 图片完整显示，卡片里可能留白
          - 100% 100% / 800px 600px 这类具体数值，强制拉伸到指定宽高
       背景图现在画在卡片（.page-wrap）身上，会跟着卡片一起滚动/移动，
       不会再铺满整个浏览器窗口了。
       ============================================================ */
    :root {
      --bg-image: url("{{ url_for('static', filename='images/bg4.jpg') }}");
      --bg-image-mobile: url("{{ url_for('static', filename='images/bg9.jpg') }}");
      --bg-size: cover;
    }

    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      margin: 0;
      background: #f2f3f5;
    }

    .page-wrap {
      max-width: 1000px;
      margin: 30px auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
        var(--bg-image);
      background-size: var(--bg-size);
      background-repeat: no-repeat;
      background-position: center center;
    }

    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th { background: #f5f5f5; }
    select { padding: 2px; }
    .income { color: #0a0; }
    .expense { color: #a00; }
    button { margin-top: 16px; padding: 8px 24px; cursor: pointer; }
    .logout-link {
      position: fixed;
      top: 14px;
      right: 18px;
      background: #fff;
      border: 2px solid #1a1a1a;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #b00020;
      text-decoration: none;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .logout-link:hover { text-decoration: underline; }

    .theme-btn-float {
      position: fixed;
      top: 14px;
      right: 96px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #1a1a1a;
      background: rgba(255, 255, 255, 0.88);
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    /* ── 深色模式 ── */
    [data-theme="dark"] body { background: #12141a; }
    [data-theme="dark"] .page-wrap {
      background-image:
        linear-gradient(rgba(18, 20, 26, 0.93), rgba(18, 20, 26, 0.93)),
        var(--bg-image);
    }
    [data-theme="dark"] .page-wrap h2 { color: #e8e8ec; }
    [data-theme="dark"] .page-wrap p { color: #c6c9d2; }
    [data-theme="dark"] table th { background: #23252e; color: #e8e8ec; }
    [data-theme="dark"] table td { border-color: #2a2d37; color: #c6c9d2; }
    [data-theme="dark"] select { background: #23252e; color: #e8e8ec; }
    [data-theme="dark"] button { background: #2d4a2f; color: #e8e8ec; }
    [data-theme="dark"] .logout-link { background: #1c1e26; color: #ff9d94; border-color: #8aa58c; }

      @media (max-width: 640px) {
      .page-wrap { margin: 12px auto; padding: 52px 10px 14px; --bg-image: var(--bg-image-mobile); }
      h2 { font-size: 15px; }
      p { font-size: 13px; }
      table { display: block; overflow-x: auto; white-space: nowrap; font-size: 11px; -webkit-overflow-scrolling: touch; }
      th, td { padding: 5px 7px; }
      .logout-link { top: 10px; right: 10px; padding: 5px 12px; font-size: 12px; max-width: 74vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h2>确认导入 — 共 {{ records|length }} 笔（{{ filename }}）</h2>
    <p>下面是自动识别的分类结果，觉得不对的可以在下拉框里改，确认无误后点"确认导入"。</p>

    <form action="{{ url_for('save') }}" method="post">
      <table>
        <tr>
          <th>时间</th><th>交易对方</th><th>商品</th><th>收/支</th><th>金额</th><th>分类</th>
        </tr>
        {% for rec in records %}
        <tr>
          <td>{{ rec.trans_time }}</td>
          <td>{{ rec.merchant }}</td>
          <td>{{ rec.product }}</td>
          <td>{{ rec.income_expense }}</td>
          <td class="{{ 'income' if rec.type == 'income' else 'expense' }}">{{ rec.amount }}</td>
          <td>
            <select name="category_{{ loop.index0 }}">
              {% for c in categories %}
                <option value="{{ c.name }}" {% if c.name == rec.category %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </td>
        </tr>
        {% endfor %}
      </table>
      <button type="submit">确认导入</button>
    </form>
  </div>
<script>
  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.getAttribute('data-theme') === 'dark';
    if (dark) { root.removeAttribute('data-theme'); } else { root.setAttribute('data-theme', 'dark'); }
    try { localStorage.setItem('fx-theme', dark ? 'light' : 'dark'); } catch (e) {}
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = dark ? '🌙' : '☀️';
  }
  (function () {
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}").catch(function () {});
    }
  })();
</script>
</body>
</html>
